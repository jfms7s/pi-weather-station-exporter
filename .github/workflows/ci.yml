name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Pi is arm; the arm runner is free for public repos.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build lgpio
        # lgpio has no wheel for CPython 3.13+; this is the README's from-source recipe
        # (on 3.11 pip just takes the wheel), so CI proves the documented steps work.
        env:
          PYPI: "1"
          CFLAGS: "-std=gnu17 -Wno-error=incompatible-pointer-types"
        run: |
          pip install setuptools wheel 'swig<4.3'
          pip install --no-build-isolation lgpio==0.2.2.0
      - name: Install
        # requirements.txt is hash-locked; the dev tools are installed in a separate,
        # unhashed step (one pip run with any hashed line requires hashes everywhere).
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
