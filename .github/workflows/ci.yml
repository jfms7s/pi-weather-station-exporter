name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Pi is arm, and RPi.GPIO builds from its sdist; the arm runner is free for public repos.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
